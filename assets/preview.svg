<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="1" stop-color="#f1ecff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- header -->
  <rect x="80" y="56" width="150" height="34" rx="17" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="155" y="78" font-size="15" font-weight="600" fill="#7c3aed" text-anchor="middle">pi extension</text>
  <text x="80" y="140" font-size="50" font-weight="800" fill="#1e1b2e">pi-codemode-snippets</text>
  <text x="82" y="180" font-size="25" fill="#6b6580">User-authored .js codemode snippets become named, composable pi tools</text>

  <!-- pipeline boxes -->
  <g filter="url(#ds)">
    <rect x="80" y="260" width="310" height="140" rx="18" fill="#ffffff" stroke="#e5e0f5" stroke-width="1.5"/>
    <rect x="455" y="260" width="290" height="140" rx="18" fill="url(#pill)"/>
    <rect x="835" y="260" width="325" height="140" rx="18" fill="#ffffff" stroke="#e5e0f5" stroke-width="1.5"/>
  </g>

  <!-- box 1: file -->
  <text x="235" y="302" font-size="30" font-weight="700" fill="#1e1b2e" text-anchor="middle">// @snippet</text>
  <text x="235" y="334" font-size="17" fill="#8b85a3" text-anchor="middle">one .js file,</text>
  <text x="235" y="356" font-size="17" fill="#8b85a3" text-anchor="middle">JSON Schema input</text>

  <!-- box 2: snippets -->
  <text x="600" y="298" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">pi-codemode-snippets</text>
  <text x="600" y="326" font-size="16" fill="#ece5ff" text-anchor="middle">register as a tool</text>
  <text x="600" y="348" font-size="16" fill="#ece5ff" text-anchor="middle">run in QuickJS</text>

  <!-- box 3: everywhere -->
  <text x="997" y="302" font-size="30" font-weight="700" fill="#1e1b2e" text-anchor="middle">tools.&lt;name&gt;()</text>
  <text x="997" y="334" font-size="17" fill="#8b85a3" text-anchor="middle">model · other tools ·</text>
  <text x="997" y="356" font-size="17" fill="#8b85a3" text-anchor="middle">composed snippets</text>

  <!-- arrows -->
  <line x1="402" y1="332" x2="443" y2="332" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="757" y1="332" x2="798" y2="332" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)"/>

  <!-- chips -->
  <g font-size="15" font-weight="600" fill="#6d28d9">
    <rect x="110" y="430" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="185" y="449" text-anchor="middle" dominant-baseline="central">JSON Schema</text>
    <rect x="276" y="430" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="351" y="449" text-anchor="middle" dominant-baseline="central">QuickJS</text>
    <rect x="442" y="430" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="517" y="449" text-anchor="middle" dominant-baseline="central">store/load</text>
    <rect x="608" y="430" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="683" y="449" text-anchor="middle" dominant-baseline="central">annotations</text>
    <rect x="774" y="430" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="849" y="449" text-anchor="middle" dominant-baseline="central">composition</text>
    <rect x="940" y="430" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="1015" y="449" text-anchor="middle" dominant-baseline="central">recursion cap</text>
    <rect x="359" y="478" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="434" y="497" text-anchor="middle" dominant-baseline="central">read-only</text>
    <rect x="525" y="478" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="600" y="497" text-anchor="middle" dominant-baseline="central">idempotent</text>
    <rect x="691" y="478" width="150" height="38" rx="19" fill="#ede9fe"/>
    <text x="766" y="497" text-anchor="middle" dominant-baseline="central">sandboxed</text>
  </g>

  <!-- footer -->
  <text x="600" y="572" font-size="20" fill="#6b6580" text-anchor="middle">best-effort · idempotent · pure glue — never blocks a tool call</text>
  <text x="600" y="600" font-size="15" fill="#a39fb8" text-anchor="middle">MIT · TypeScript strict · 99 unit tests · 6 example snippets · 1 bundled skill</text>
</svg>
