<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>pi-codemode-snippets — user-authored .js codemode snippets become named, composable pi tools</title>
  <desc>A pi extension: one // @snippet: pragma turns a codemode script into a named pi tool with JSON Schema input, QuickJS sandboxing, and cross-snippet composition.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b14"/>
      <stop offset="0.55" stop-color="#110f1d"/>
      <stop offset="1" stop-color="#0d0c17"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1538"/>
      <stop offset="1" stop-color="#151129"/>
    </linearGradient>
    <linearGradient id="chipfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .code { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      .kw   { fill: #c792ea; }
      .fn   { fill: #82aaff; }
      .str  { fill: #7ee787; }
      .num  { fill: #f2cc60; }
      .pun  { fill: #8b849c; }
      .pl   { fill: #e6e1f5; }
      .cm   { fill: #6b7391; }
      .key  { fill: #79c0ff; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="1380" cy="60" rx="560" ry="420" fill="url(#glowA)"/>
  <ellipse cx="180" cy="960" rx="540" ry="400" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>

  <!-- header row -->
  <rect x="120" y="64" width="196" height="46" rx="23" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-opacity="0.7"/>
  <text x="218" y="94" font-size="24" font-weight="700" fill="#c4b5fd" text-anchor="middle" letter-spacing="0.5">pi extension</text>
  <text x="1480" y="94" font-size="24" font-weight="600" fill="#6f6a85" text-anchor="end" letter-spacing="0.5">MIT · 142 tests · ships a pi-skill</text>

  <!-- title (dominant element) -->
  <text x="800" y="240" font-size="104" font-weight="800" fill="#f6f4ff" text-anchor="middle" letter-spacing="-1">pi-codemode-snippets</text>
  <text x="800" y="306" font-size="34" fill="#9a94b3" text-anchor="middle">One <tspan fill="#a78bfa" font-weight="600">// @snippet:</tspan> pragma turns a codemode .js file into a named pi tool</text>

  <!-- left: snippet file -->
  <g filter="url(#soft)">
    <rect x="120" y="360" width="760" height="340" rx="18" fill="#0f0e18" stroke="#2b2745" stroke-width="1.5"/>
  </g>
  <path d="M120,378 a18,18 0 0 1 18,-18 h724 a18,18 0 0 1 18,18 v30 h-760 z" fill="#1a1828"/>
  <line x1="120" y1="408" x2="880" y2="408" stroke="#2b2745" stroke-width="1.5"/>
  <circle cx="150" cy="384" r="7" fill="#ff5f57"/>
  <circle cx="174" cy="384" r="7" fill="#febc2e"/>
  <circle cx="198" cy="384" r="7" fill="#28c840"/>
  <text x="232" y="393" class="code" font-size="22" fill="#8b849c">~/.pi/agent/snippets/list_open_prs.js</text>

  <text x="152" y="452" class="code" font-size="23" xml:space="preserve"><tspan class="cm">// </tspan><tspan class="kw" font-weight="700">@snippet:</tspan><tspan class="pun"> {</tspan></text>
  <text x="152" y="486" class="code" font-size="23" xml:space="preserve"><tspan class="cm">//   </tspan><tspan class="key">"description"</tspan><tspan class="pun">: </tspan><tspan class="str">"List open PRs."</tspan><tspan class="pun">,</tspan></text>
  <text x="152" y="520" class="code" font-size="23" xml:space="preserve"><tspan class="cm">//   </tspan><tspan class="key">"input"</tspan><tspan class="pun">: { </tspan><tspan class="key">"repo"</tspan><tspan class="pun">: </tspan><tspan class="str">"string"</tspan><tspan class="pun"> } }</tspan></text>
  <text x="152" y="563" class="code" font-size="23" xml:space="preserve"><tspan class="kw">const</tspan><tspan class="pl"> r = </tspan><tspan class="kw">await</tspan><tspan class="pl"> tools.</tspan><tspan class="fn">bash</tspan><tspan class="pun">({ command:</tspan></text>
  <text x="176" y="597" class="code" font-size="23" xml:space="preserve"><tspan class="str">`gh pr list -R ${input.repo}`</tspan><tspan class="pun"> });</tspan></text>
  <text x="152" y="631" class="code" font-size="23" xml:space="preserve"><tspan class="kw">return</tspan><tspan class="pl"> JSON.</tspan><tspan class="fn">parse</tspan><tspan class="pun">(r.output);</tspan></text>
  <text x="152" y="677" class="code" font-size="21" fill="#5c5775">your file, your code — registered at session start</text>

  <!-- arrow -->
  <circle cx="930" cy="530" r="44" fill="url(#glowA)"/>
  <line x1="906" y1="530" x2="954" y2="530" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- right: registered tool card -->
  <g filter="url(#soft)">
    <rect x="980" y="360" width="500" height="340" rx="18" fill="url(#card)" stroke="#4c3f8f" stroke-width="1.5"/>
  </g>
  <text x="1016" y="406" class="code" font-size="21" font-weight="700" fill="#8b7fd8" letter-spacing="3">REGISTERED PI TOOL</text>
  <text x="1016" y="466" font-size="48" font-weight="800" fill="#ffffff">list_open_prs</text>
  <text x="1016" y="510" class="code" font-size="23" fill="#7ee787">list_open_prs({ repo })</text>
  <line x1="1016" y1="536" x2="1444" y2="536" stroke="#3b3368" stroke-width="1.5"/>
  <g font-size="26" fill="#cfc8ea">
    <path d="M1018,573 l9,6 l-9,6 z" fill="#a78bfa"/>
    <text x="1044" y="585">the model calls it by name</text>
    <path d="M1018,625 l9,6 l-9,6 z" fill="#a78bfa"/>
    <text x="1044" y="637">other snippets compose it</text>
    <path d="M1018,677 l9,6 l-9,6 z" fill="#a78bfa"/>
    <text x="1044" y="689" class="code" font-size="21" fill="#7ee787">QuickJS sandbox · JSON Schema</text>
  </g>

  <!-- feature chips -->
  <g font-size="26" font-weight="600" fill="#c4b5fd">
    <rect x="367" y="744" width="216" height="56" rx="28" fill="url(#chipfill)" stroke="#4c3f8f" stroke-opacity="0.7"/>
    <text x="475" y="773" text-anchor="middle" dominant-baseline="central">QuickJS sandbox</text>
    <rect x="599" y="744" width="216" height="56" rx="28" fill="url(#chipfill)" stroke="#4c3f8f" stroke-opacity="0.7"/>
    <text x="707" y="773" text-anchor="middle" dominant-baseline="central">composition</text>
    <rect x="831" y="744" width="216" height="56" rx="28" fill="url(#chipfill)" stroke="#4c3f8f" stroke-opacity="0.7"/>
    <text x="939" y="773" text-anchor="middle" dominant-baseline="central">idempotent</text>
    <rect x="1063" y="744" width="170" height="56" rx="28" fill="url(#chipfill)" stroke="#4c3f8f" stroke-opacity="0.7"/>
    <text x="1148" y="773" text-anchor="middle" dominant-baseline="central">+ skill</text>
  </g>

  <!-- install pill -->
  <rect x="330" y="846" width="940" height="88" rx="16" fill="#16161d" stroke="url(#accent)" stroke-width="3"/>
  <text x="800" y="903" class="code" font-size="38" fill="#a78bfa" text-anchor="middle">$ pi install npm:pi-codemode-snippets</text>

  <!-- footer -->
  <text x="800" y="978" font-size="28" fill="#5c5775" text-anchor="middle">pi.dev/packages/pi-codemode-snippets</text>
</svg>
